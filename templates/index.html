<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CaptionForge</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="blobs"><i></i><i></i><i></i></div>
<main id="gate" class="glass">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H11l-4 3v-3a3 3 0 0 1-3-3z"/></svg></div>
  <h1>Caption<b>Forge</b></h1><p>Captions, silence cuts and exports for Shorts, Reels and TikToks. Runs fully on your machine.</p>
  <label class="drop" id="drop"><input type="file" id="file" accept="video/*" hidden><svg viewBox="0 0 24 24"><path d="M12 16V4m0 0-4 4m4-4 4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg><span>Drop a video or click to browse</span></label>
</main>
<section id="app">
 <header class="glass top"><b class="brand">Caption<i>Forge</i></b><span class="sp"></span><kbd>Space</kbd> play <kbd>←→</kbd> seek <kbd>S</kbd> safe zones<button id="export" class="btn y">Export MP4</button></header>
 <div class="work">
  <div class="stagewrap"><div id="stage"><video id="v" playsinline></video><div id="safe"></div><div id="cap"></div></div>
   <div class="bar glass"><button id="play" class="btn ic"><svg viewBox="0 0 24 24"><path id="pp" d="M7 5v14l12-7z"/></svg></button><input id="seek" type="range" min="0" max="1000" value="0"><span id="tc">0:00</span></div></div>
  <aside class="glass panel">
   <details open><summary>Format</summary>
    <div class="chips" id="ratios"></div>
    <div class="seg" id="fit"><button data-f="fill" class="on">Fill (crop)</button><button data-f="blur">Fit + blur bars</button></div>
    <label class="sw">Safe-zone overlay<input type="checkbox" id="safeT"><s></s></label></details>
   <details open><summary>Captions</summary>
    <div class="row"><select id="model"><option>tiny</option><option selected>base</option><option>small</option></select><button id="gen" class="btn b">Auto-caption</button></div>
    <label>Words per screen <output id="nO">3</output><input type="range" id="n" min="1" max="8" value="3"></label>
    <textarea id="txt" placeholder="Transcript appears here. Edit words freely (keep the same word count to keep timing)."></textarea>
    <button id="srt" class="btn g">Download .srt</button></details>
   <details><summary>Style</summary>
    <label>Font<select id="font"><option>Arial Black</option><option>Impact</option><option>Arial</option><option>Verdana</option><option>Georgia</option><option>Comic Sans MS</option></select></label>
    <label>Size <output></output><input type="range" id="size" min="3" max="12" step=".5"></label>
    <label>Vertical position <output></output><input type="range" id="y" min="10" max="90"></label>
    <label>Outline <output></output><input type="range" id="sw" min="0" max="16"></label>
    <div class="cols"><label>Text<input type="color" id="color"></label><label>Active word<input type="color" id="hi"></label><label>Outline<input type="color" id="stroke"></label></div>
    <div class="sw3"><button data-c="#FFFFFF">W</button><button data-c="#FFC400" style="--c:#FFC400">Y</button><button data-c="#E5322D" style="--c:#E5322D">R</button><button data-c="#2563EB" style="--c:#2563EB">B</button><button data-c="#000000" style="--c:#000">K</button></div>
    <label class="sw">UPPERCASE<input type="checkbox" id="upper"><s></s></label></details>
   <details><summary>Silence</summary>
    <label>Threshold <output id="dbO">-30 dB</output><input type="range" id="db" min="-60" max="-15" value="-30"></label>
    <label>Min length <output id="mnO">0.4 s</output><input type="range" id="mn" min="2" max="20" value="4"></label>
    <button id="sil" class="btn b">Detect silences</button>
    <label class="sw">Remove silences<input type="checkbox" id="cutT" checked><s></s></label>
    <small id="silInfo">Click a red block on the timeline to keep or remove it.</small></details>
  </aside>
 </div>
 <div class="glass tl" id="tl"><div class="lane"><span>Video</span><div class="trk" id="tV"></div></div><div class="lane"><span>Audio</span><div class="trk" id="tA"></div></div><div class="lane"><span>Captions</span><div class="trk" id="tC"></div></div><div id="head"></div></div>
</section>
<div id="toast"></div><script src="/static/app.js"></script></body></html>
